<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>HairSalon Studio Inventory System 2.0</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
    body { font-family: 'Inter', sans-serif; }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen">

  <header class="bg-white border-b border-slate-200 sticky top-0 z-30 shadow-sm">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-4 flex flex-col md:flex-row md:items-center md:justify-between gap-4">
      <div>
        <h1 class="text-xl font-bold tracking-tight text-slate-900">HairSalon Studio Inventory System 2.0</h1>
        <p class="text-xs text-slate-500">Live stock management & reorder tracker</p>
      </div>
      <div class="flex items-center gap-3">
        <button onclick="exportRestockOrder()" class="inline-flex items-center px-3.5 py-2 border border-rose-300 text-xs font-semibold rounded-lg text-rose-700 bg-rose-50 hover:bg-rose-100 transition">
          Export Restock Order
        </button>
      </div>
    </div>
  </header>

  <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6 space-y-6">

    <div class="grid grid-cols-2 sm:grid-cols-4 gap-4">
      <div class="bg-white p-4 rounded-xl border border-slate-200 shadow-sm">
        <p class="text-xs font-medium text-slate-500">Total Items Tracked</p>
        <p id="totalCount" class="text-2xl font-bold text-slate-900 mt-1">0</p>
      </div>
      <div class="bg-white p-4 rounded-xl border border-slate-200 shadow-sm">
        <p class="text-xs font-medium text-emerald-600">In Stock (≥2)</p>
        <p id="inStockCount" class="text-2xl font-bold text-emerald-600 mt-1">0</p>
      </div>
      <div class="bg-white p-4 rounded-xl border border-slate-200 shadow-sm">
        <p class="text-xs font-medium text-amber-600">Low Stock (1)</p>
        <p id="lowStockCount" class="text-2xl font-bold text-amber-600 mt-1">0</p>
      </div>
      <div class="bg-white p-4 rounded-xl border border-slate-200 shadow-sm">
        <p class="text-xs font-medium text-rose-600">Out of Stock (0)</p>
        <p id="outStockCount" class="text-2xl font-bold text-rose-600 mt-1">0</p>
      </div>
    </div>

    <div class="bg-white p-4 rounded-xl border border-slate-200 shadow-sm flex flex-col md:flex-row gap-3 items-center justify-between">
      <div class="relative w-full md:w-80">
        <input 
          type="text" 
          id="searchInput" 
          oninput="renderTable()" 
          placeholder="Search shade or family..." 
          class="w-full pl-9 pr-3 py-2 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-slate-900"
        />
        <svg class="w-4 h-4 text-slate-400 absolute left-3 top-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
        </svg>
      </div>
      <div class="flex flex-wrap gap-2 w-full md:w-auto">
        <select id="familyFilter" onchange="renderTable()" class="border border-slate-300 text-sm rounded-lg px-3 py-2 bg-white text-slate-700 focus:outline-none focus:ring-2 focus:ring-slate-900">
          <option value="ALL">All Families</option>
        </select>
        <select id="statusFilter" onchange="renderTable()" class="border border-slate-300 text-sm rounded-lg px-3 py-2 bg-white text-slate-700 focus:outline-none focus:ring-2 focus:ring-slate-900">
          <option value="ALL">All Statuses</option>
          <option value="In Stock">In Stock</option>
          <option value="Low Stock">Low Stock</option>
          <option value="Out of Stock">Out of Stock</option>
        </select>
      </div>
    </div>

    <div class="bg-white border border-slate-200 rounded-xl overflow-hidden shadow-sm">
      <div class="overflow-x-auto">
        <table class="min-w-full divide-y divide-slate-200 text-left text-sm">
          <thead class="bg-slate-50 text-slate-500 uppercase text-[11px] font-semibold tracking-wider">
            <tr>
              <th scope="col" class="px-6 py-3">Color Family</th>
              <th scope="col" class="px-6 py-3">Shade</th>
              <th scope="col" class="px-6 py-3">Quantity</th>
              <th scope="col" class="px-6 py-3">Status</th>
              <th scope="col" class="px-6 py-3 text-right">Adjust</th>
            </tr>
          </thead>
          <tbody id="inventoryTableBody" class="divide-y divide-slate-200">
            </tbody>
        </table>
      </div>
      <div id="emptyState" class="hidden p-8 text-center text-sm text-slate-500">
        No matching shades found.
      </div>
    </div>
  </main>

      { family: "Paul Mitchell TD", shade: "9MT Light Blonde Matte Tone", qty: 1 },
      { family: "Paul Mitchell TD", shade: "9N Natural", qty: 2 },
      { family: "Paul Mitchell TD", shade: "9NB Natural Beige", qty: 1 },
      { family: "Paul Mitchell TD", shade: "9P Pearl", qty: 2 }

    let inventory = JSON.parse(localStorage.getItem('salon_inventory')) || initialData;

    function saveState() {
      localStorage.setItem('salon_inventory', JSON.stringify(inventory));
      renderMetrics();
      renderTable();
    }

    function getStatus(qty) {
      if (qty <= 0) return "Out of Stock";
      if (qty === 1) return "Low Stock";
      return "In Stock";
    }

    function populateFamilyFilter() {
      const select = document.getElementById('familyFilter');
      const families = [...new Set(inventory.map(item => item.family))].sort();
      families.forEach(f => {
        const opt = document.createElement('option');
        opt.value = f;
        opt.textContent = f;
        select.appendChild(opt);
      });
    }

    function updateQuantity(index, delta) {
      const newQty = Math.max(0, inventory[index].qty + delta);
      inventory[index].qty = newQty;
      saveState();
    }

    function renderMetrics() {
      const inStock = inventory.filter(i => i.qty >= 2).length;
      const lowStock = inventory.filter(i => i.qty === 1).length;
      const outStock = inventory.filter(i => i.qty === 0).length;

      document.getElementById('totalCount').innerText = inventory.length;
      document.getElementById('inStockCount').innerText = inStock;
      document.getElementById('lowStockCount').innerText = lowStock;
      document.getElementById('outStockCount').innerText = outStock;
    }

    function renderTable() {
      const query = document.getElementById('searchInput').value.toLowerCase();
      const family = document.getElementById('familyFilter').value;
      const status = document.getElementById('statusFilter').value;
      const tbody = document.getElementById('inventoryTableBody');

      tbody.innerHTML = '';
      let matchedCount = 0;

      inventory.forEach((item, index) => {
        const itemStatus = getStatus(item.qty);

        const matchesSearch = item.shade.toLowerCase().includes(query) || item.family.toLowerCase().includes(query);
        const matchesFamily = family === 'ALL' || item.family === family;
        const matchesStatus = status === 'ALL' || itemStatus === status;

        if (matchesSearch && matchesFamily && matchesStatus) {
          matchedCount++;

          let badgeClass = 'bg-emerald-100 text-emerald-800';
          if (itemStatus === 'Low Stock') badgeClass = 'bg-amber-100 text-amber-800';
          if (itemStatus === 'Out of Stock') badgeClass = 'bg-rose-100 text-rose-800';

          const tr = document.createElement('tr');
          tr.className = 'hover:bg-slate-50 transition';
          tr.innerHTML = `
            <td class="px-6 py-3 font-medium text-slate-900">${item.family}</td>
            <td class="px-6 py-3 text-slate-700">${item.shade}</td>
            <td class="px-6 py-3 font-semibold ${item.qty === 0 ? 'text-rose-600' : 'text-slate-900'}">${item.qty}</td>
            <td class="px-6 py-3">
              <span class="inline-flex items-center px-2 py-0.5 rounded text-xs font-semibold ${badgeClass}">
                ${itemStatus}
              </span>
            </td>
            <td class="px-6 py-3 text-right">
              <div class="inline-flex rounded-lg border border-slate-200 shadow-sm bg-white overflow-hidden">
                <button onclick="updateQuantity(${index}, -1)" class="px-2.5 py-1 text-slate-600 hover:bg-slate-100 font-bold border-r border-slate-200 transition">-</button>
                <button onclick="updateQuantity(${index}, 1)" class="px-2.5 py-1 text-slate-600 hover:bg-slate-100 font-bold transition">+</button>
              </div>
            </td>
          `;
          tbody.appendChild(tr);
        }
      });

      document.getElementById('emptyState').classList.toggle('hidden', matchedCount > 0);
    }

    function exportRestockOrder() {
      const restockItems = inventory.filter(i => i.qty <= 1);
      if (restockItems.length === 0) {
        alert("All shades are sufficiently stocked!");
        return;
      }

      let csv = "Color Family,Shade,Current Quantity,Suggested Order Qty\n";
      restockItems.forEach(i => {
        const orderQty = 3 - i.qty; // Targets a par stock of 3
        csv += `"${i.family}","${i.shade}",${i.qty},${orderQty}\n`;
      });

      const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");
      link.setAttribute("href", url);
      link.setAttribute("download", `Restock_Order_${new Date().toISOString().slice(0,10)}.csv`);
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
    }

    // Init
    populateFamilyFilter();
    renderMetrics();
    renderTable();

</html>
